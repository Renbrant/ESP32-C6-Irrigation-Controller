type: sections
title: irriBRANT
path: irribrant
icon: mdi:sprinkler-variant
max_columns: 4
theme: Frosted Glass Dark
header:
  layout: center
  badges_position: top
  badges_wrap: wrap
  card:
    type: custom:mushroom-template-card
    entity: switch.irribrant_pro_active_cycle
    primary: irriBRANT PRO v4.2
    secondary: |-
      {% if is_state('switch.irribrant_pro_active_cycle', 'on') %}
        Watering now
      {% else %}
        System ready
      {% endif %} - Smart irrigation control and monitoring
    icon: mdi:sprinkler-variant
    multiline_secondary: true
    tap_action:
      action: none
badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: switch.irribrant_pro_main_irrigation_system
    name: irriBRANT PRO
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: switch.irribrant_pro_active_cycle
    name: Cycle
  - type: custom:mushroom-template-badge
    entity: switch.backyard_irribrant_pro_use_master_valve
    content: >-
      Master {% if is_state('switch.backyard_irribrant_pro_use_master_valve',
      'on') %}Yes{% else %}No{% endif %}
    icon: >-
      {% if is_state('switch.backyard_irribrant_pro_use_master_valve', 'on')
      %}mdi:valve{% else %}mdi:valve-closed{% endif %}
    color: >-
      {% if is_state('switch.backyard_irribrant_pro_use_master_valve', 'on')
      %}blue{% else %}grey{% endif %}
    tap_action:
      action: toggle
  - type: custom:mushroom-template-badge
    entity: binary_sensor.backyard_irribrant_pro_master_valve_output
    content: >-
      Output {% if
      is_state('binary_sensor.backyard_irribrant_pro_master_valve_output', 'on')
      %}Open{% else %}Closed{% endif %}
    icon: >-
      {% if is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
      'on') %}mdi:valve-open{% else %}mdi:valve-closed{% endif %}
    color: >-
      {% if is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
      'on') %}blue{% else %}grey{% endif %}
    tap_action:
      action: more-info
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.irribrant_pro_wifi_signal
    name: WiFi Signal
    show_entity_picture: false
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.irribrant_pro_uptime
    name: Uptime
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.irribrant_rain_probability_12h
    icon: mdi:weather-lightning-rainy
    name: Rain probability 24h
sections:
  - type: grid
    column_span: 4
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Upcoming Watering
            secondary: |
              {{ states('sensor.irribrant_pro_next_activities') }}
            icon: mdi:calendar-clock
            multiline_secondary: true
            layout: vertical
            tap_action:
              action: more-info
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: switch.irribrant_pro_main_irrigation_system
                name: Main
                icon: mdi:power
                tap_action:
                  action: toggle
                features_position: bottom
                vertical: false
              - type: tile
                entity: switch.irribrant_pro_active_cycle
                name: Cycle
                icon: mdi:sprinkler
                tap_action:
                  action: toggle
                features_position: bottom
                vertical: false
              - type: tile
                entity: switch.irribrant_pro_auto_advance_zones
                name: Advance
                icon: mdi:skip-next-circle
                tap_action:
                  action: toggle
                features_position: bottom
                vertical: false
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Run program
            subtitle: Select the program to run now
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: button.irribrant_pro_run_program_a
                name: Run A
                icon: mdi:alpha-a-circle
                hide_state: true
                vertical: false
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.irribrant_pro_run_program_a
                features_position: bottom
              - type: tile
                entity: button.irribrant_pro_run_program_b
                name: Run B
                icon: mdi:alpha-b-circle
                hide_state: true
                vertical: false
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.irribrant_pro_run_program_b
                features_position: bottom
              - type: tile
                entity: button.irribrant_pro_run_program_c
                name: Run C
                icon: mdi:alpha-c-circle
                hide_state: true
                vertical: false
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.irribrant_pro_run_program_c
                features_position: bottom
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Active Zones
            subtitle: >-
              Disabled zones are hidden. Zone 9 becomes the physical Master
              Valve when Master Valve mode is enabled.
          - type: grid
            columns: 3
            square: false
            cards:
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_1
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_1_valve
                  primary: Zone 1
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_1_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_1_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_1_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_2
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_2_valve
                  primary: Zone 2
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_2_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_2_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_2_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_3
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_3_valve
                  primary: Zone 3
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_3_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_3_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_3_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_4
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_4_valve
                  primary: Zone 4
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_4_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_4_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_4_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_5
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_5_valve
                  primary: Zone 5
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_5_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_5_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_5_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_6
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_6_valve
                  primary: Zone 6
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_6_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_6_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_6_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_7
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_7_valve
                  primary: Zone 7
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_7_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_7_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_7_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.irribrant_pro_enable_zone_8
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_8_valve
                  primary: Zone 8
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_8_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_8_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_8_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.backyard_irribrant_pro_use_master_valve
                    state: "off"
                  - entity: switch.irribrant_pro_enable_zone_9
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: switch.irribrant_pro_zone_9_valve
                  primary: Zone 9
                  secondary: >-
                    {{ 'OPEN' if is_state('switch.irribrant_pro_zone_9_valve',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:sprinkler' if
                    is_state('switch.irribrant_pro_zone_9_valve', 'on') else
                    'mdi:sprinkler-variant' }}
                  icon_color: >-
                    {{ 'blue' if is_state('switch.irribrant_pro_zone_9_valve',
                    'on') else 'grey' }}
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.backyard_irribrant_pro_use_master_valve
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  entity: binary_sensor.backyard_irribrant_pro_master_valve_output
                  primary: Master Valve
                  secondary: >-
                    {{ 'OPEN' if
                    is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
                    'on') else 'Closed' }}
                  icon: >-
                    {{ 'mdi:valve-open' if
                    is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
                    'on') else 'mdi:valve-closed' }}
                  icon_color: >-
                    {{ 'blue' if
                    is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
                    'on') else 'grey' }}
                  tap_action:
                    action: more-info
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Settings
            subtitle: Open only the configuration panels you need.
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Zones
                icon: mdi:tune-variant
                tap_action:
                  action: navigate
                  navigation_path: "#zones-popup"
              - type: custom:mushroom-template-card
                primary: Rain
                icon: mdi:weather-pouring
                tap_action:
                  action: navigate
                  navigation_path: "#rain-popup"
              - type: custom:mushroom-template-card
                primary: Status
                icon: mdi:chart-timeline-variant
                tap_action:
                  action: navigate
                  navigation_path: "#status-popup"
              - type: custom:mushroom-template-card
                primary: Program A
                icon: mdi:alpha-a-circle
                tap_action:
                  action: navigate
                  navigation_path: "#program-a-popup"
              - type: custom:mushroom-template-card
                primary: Program B
                icon: mdi:alpha-b-circle
                tap_action:
                  action: navigate
                  navigation_path: "#program-b-popup"
              - type: custom:mushroom-template-card
                primary: Program C
                icon: mdi:alpha-c-circle
                tap_action:
                  action: navigate
                  navigation_path: "#program-c-popup"
  - type: grid
    column_span: 4
    cards:
      - type: history-graph
        grid_options:
          columns: full
        entities:
          - entity: switch.backyard_irribrant_pro_use_master_valve
            name: Master Mode
          - entity: binary_sensor.backyard_irribrant_pro_master_valve_output
            name: Master Output
          - entity: switch.irribrant_pro_active_cycle
            name: Active Cycle
          - entity: switch.irribrant_pro_zone_1_valve
            name: Zone 1
          - entity: switch.irribrant_pro_zone_2_valve
            name: Zone 2
          - entity: switch.irribrant_pro_zone_3_valve
            name: Zone 3
          - entity: switch.irribrant_pro_zone_4_valve
            name: Zone 4
          - entity: switch.irribrant_pro_zone_5_valve
            name: Zone 5
          - entity: switch.irribrant_pro_zone_6_valve
            name: Zone 6
          - entity: switch.irribrant_pro_zone_7_valve
            name: Zone 7
          - entity: switch.irribrant_pro_zone_8_valve
            name: Zone 8
          - entity: switch.irribrant_pro_zone_9_valve
            name: Zone 9
        title: Watering Activity / Offset Check
        hours_to_show: 24
        logarithmic_scale: false
      - type: custom:apexcharts-card
        header:
          show: true
          title: Rain History & Forecast
          show_states: true
          colorize_states: true
        graph_span: 24h
        now:
          show: true
          label: Now
        apex_config:
          chart:
            height: 300
            width: 100%
          stroke:
            width:
              - 2
              - 3
            curve: smooth
          yaxis:
            - id: rain
              title:
                text: Rain Intensity (in/h)
              min: 0
              decimalsInFloat: 2
              opposite: false
            - id: probability
              title:
                text: Rain Probability (%)
              min: 0
              max: 100
              decimalsInFloat: 0
              opposite: true
          legend:
            show: true
        series:
          - entity: sensor.irribrant_current_rain_intensity
            name: Rain Intensity
            type: area
            yaxis_id: rain
            group_by:
              duration: 10min
              func: avg
          - entity: sensor.irribrant_rain_probability_12h
            name: Rain Probability
            type: line
            yaxis_id: probability
            group_by:
              duration: 10min
              func: avg
        grid_options:
          columns: full
  - type: grid
    column_span: 4
    cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#zones-popup"
        name: Zone Settings
        icon: mdi:tune-variant
        popup_mode: adaptive-dialog
        cards:
          - type: custom:mushroom-title-card
            title: Master Valve
            subtitle: >-
              When enabled, Zone 9 output is reserved as the physical Master
              Valve. Use the offsets to validate the opening and closing
              sequence.
          - type: entities
            title: Master Valve Settings
            show_header_toggle: false
            entities:
              - entity: switch.backyard_irribrant_pro_use_master_valve
                name: Use Master Valve
              - entity: number.backyard_irribrant_pro_master_valve_open_offset
                name: Master Open Offset
              - entity: number.backyard_irribrant_pro_master_valve_close_offset
                name: Master Close Offset
          - type: custom:mushroom-template-card
            entity: binary_sensor.backyard_irribrant_pro_master_valve_output
            primary: Master Valve Output
            secondary: >-
              {{ 'OPEN' if
              is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
              'on') else 'Closed' }} · Open offset: {{
              states('number.backyard_irribrant_pro_master_valve_open_offset')
              }}s · Close offset: {{
              states('number.backyard_irribrant_pro_master_valve_close_offset')
              }}s
            icon: >-
              {{ 'mdi:valve-open' if
              is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
              'on') else 'mdi:valve-closed' }}
            icon_color: >-
              {{ 'blue' if
              is_state('binary_sensor.backyard_irribrant_pro_master_valve_output',
              'on') else 'grey' }}
            tap_action:
              action: more-info
          - type: custom:mushroom-title-card
            title: Zone Availability
            subtitle: Zone 9 is available only when Master Valve mode is disabled.
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: switch.irribrant_pro_enable_zone_1
                name: Zone 1
                icon: mdi:numeric-1-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_2
                name: Zone 2
                icon: mdi:numeric-2-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_3
                name: Zone 3
                icon: mdi:numeric-3-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_4
                name: Zone 4
                icon: mdi:numeric-4-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_5
                name: Zone 5
                icon: mdi:numeric-5-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_6
                name: Zone 6
                icon: mdi:numeric-6-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_7
                name: Zone 7
                icon: mdi:numeric-7-circle
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.irribrant_pro_enable_zone_8
                name: Zone 8
                icon: mdi:numeric-8-circle
                tap_action:
                  action: toggle
              - type: conditional
                conditions:
                  - entity: switch.backyard_irribrant_pro_use_master_valve
                    state: "off"
                card:
                  type: tile
                  entity: switch.irribrant_pro_enable_zone_9
                  name: Zone 9
                  icon: mdi:numeric-9-circle
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.backyard_irribrant_pro_use_master_valve
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  primary: Zone 9
                  secondary: Reserved as Master Valve
                  icon: mdi:valve
                  icon_color: blue
                  tap_action:
                    action: none
        button_type: name
        sub_button:
          main: []
          bottom: []
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#rain-popup"
        name: Rain Settings
        icon: mdi:weather-pouring
        popup_mode: adaptive-dialog
        cards:
          - type: entities
            title: Rain Settings
            show_header_toggle: false
            entities:
              - entity: binary_sensor.irribrant_pro_rain_lock
                name: Rain Lock
              - entity: select.irribrant_pro_rain_source
                name: Rain Source
              - entity: number.irribrant_pro_rain_delay_hours
                name: Rain Delay Hours
              - entity: number.irribrant_pro_rain_probability_threshold
                name: Probability Threshold
              - entity: number.irribrant_pro_rain_intensity_block_threshold
                name: Intensity Block Threshold
              - entity: sensor.irribrant_current_rain_intensity
                name: Current Rain Intensity
              - entity: sensor.irribrant_rain_probability_12h
                name: Rain Probability
              - entity: button.irribrant_pro_apply_rain_delay
                name: Apply Rain Delay
        button_type: name
        sub_button:
          main: []
          bottom: []
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#status-popup"
        name: System Status
        icon: mdi:chart-timeline-variant
        popup_mode: adaptive-dialog
        cards:
          - type: entities
            title: System Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.irribrant_pro_wifi_status
                name: WiFi
              - entity: sensor.irribrant_pro_wifi_signal
                name: Signal
              - entity: sensor.irribrant_pro_uptime
                name: Uptime
              - entity: sensor.irrabrant_firmware_version
                name: Firmware Version
              - entity: binary_sensor.irribrant_pro_system_has_schedule
                name: Schedule
              - entity: binary_sensor.irribrant_pro_rain_lock
                name: Rain Lock
              - entity: switch.backyard_irribrant_pro_use_master_valve
                name: Use Master Valve
              - entity: binary_sensor.backyard_irribrant_pro_master_valve_output
                name: Master Valve Output
              - entity: number.backyard_irribrant_pro_master_valve_open_offset
                name: Master Open Offset
              - entity: number.backyard_irribrant_pro_master_valve_close_offset
                name: Master Close Offset
              - entity: switch.irribrant_pro_active_cycle
                name: Active Cycle
              - entity: switch.irribrant_pro_main_irrigation_system
                name: Main System
          - type: logbook
            target:
              entity_id:
                - switch.irribrant_pro_active_cycle
                - switch.backyard_irribrant_pro_use_master_valve
                - binary_sensor.backyard_irribrant_pro_master_valve_output
                - switch.irribrant_pro_zone_1_valve
                - switch.irribrant_pro_zone_2_valve
                - switch.irribrant_pro_zone_3_valve
                - switch.irribrant_pro_zone_4_valve
                - switch.irribrant_pro_zone_5_valve
                - switch.irribrant_pro_zone_6_valve
                - switch.irribrant_pro_zone_7_valve
                - switch.irribrant_pro_zone_8_valve
                - switch.irribrant_pro_zone_9_valve
        button_type: name
        sub_button:
          main: []
          bottom: []
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#program-a-popup"
        name: Program A
        icon: mdi:alpha-a-circle
        popup_mode: adaptive-dialog
        cards:
          - type: entities
            title: Schedule
            show_header_toggle: false
            entities:
              - entity: switch.irribrant_pro_program_a_schedule_enabled
                name: Enabled
              - entity: select.irribrant_pro_program_a_frequency
