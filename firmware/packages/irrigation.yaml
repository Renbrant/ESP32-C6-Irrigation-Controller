          on_turn_off:
            - switch.turn_off: program_a_zone_6_enabled
            - switch.turn_off: program_b_zone_6_enabled
            - switch.turn_off: program_c_zone_6_enabled
        run_duration_number:
          id: zone_6_duration
          name: "Zone 6 Duration"
          initial_value: 10
          restore_value: true
          min_value: 1
          max_value: 30
          step: 1
          unit_of_measurement: "min"

      - valve_switch: "Zone 7 Valve"
        valve_switch_id: zone_7_output
        enable_switch:
          name: "Enable Zone 7"
          id: zone_7_enabled
          on_turn_off:
            - switch.turn_off: program_a_zone_7_enabled
            - switch.turn_off: program_b_zone_7_enabled
            - switch.turn_off: program_c_zone_7_enabled
        run_duration_number:
          id: zone_7_duration
          name: "Zone 7 Duration"
          initial_value: 10
