      - valve_switch: "Zone 8 Valve"
        valve_switch_id: zone_8_output
        enable_switch:
          name: "Enable Zone 8"
          id: zone_8_enabled
          on_turn_off:
            - switch.turn_off: program_a_zone_8_enabled
            - switch.turn_off: program_b_zone_8_enabled
            - switch.turn_off: program_c_zone_8_enabled
        run_duration_number:
          id: zone_8_duration
          name: "Zone 8 Duration"
          initial_value: 10
          restore_value: true
          min_value: 1
          max_value: 30
          step: 1
          unit_of_measurement: "min"

      - valve_switch: "Zone 9 Valve"
        valve_switch_id: zone_9_output
        enable_switch:
          name: "Enable Zone 9"
          id: zone_9_enabled
          on_turn_on:
            - if:
                condition:
                  lambda: |-
                    return id(use_master_valve).state;
                then:
                  - logger.log:
                      level: WARN
                      format: "Enable Zone 9 request ignored because Master Valve mode is enabled"
                  - switch.template.publish:
                      id: zone_9_enabled
                      state: OFF
          on_turn_off:
            - switch.turn_off: program_a_zone_9_enabled
            - switch.turn_off: program_b_zone_9_enabled
            - switch.turn_off: program_c_zone_9_enabled
        run_duration_number:
          id: zone_9_duration
          name: "Zone 9 Duration"
          initial_value: 10
          restore_value: true
          min_value: 1
          max_value: 30
          step: 1
          unit_of_measurement: "min"
